[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-dinov3"
version = "0.1.0"
description = "DINOv3 baseline for RSNA Knee Abnormality Detection"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "transformers>=4.56,<6",
  "pydicom>=3.0,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "iterative-stratification>=0.1.9,<1",
  "tqdm>=4.66,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

